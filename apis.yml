aid: coreshell
name: Coreshell
description: 'Coreshell (Coreshell Technologies, Inc.) is a San Leandro, California battery
  technology company founded in 2017 that develops silicon-anode lithium-ion battery cells
  built on low-cost, domestically sourced metallurgical-grade silicon instead of graphite
  or refined polysilicon. A proprietary nanolayer surface coating stabilizes the silicon
  anode, and the company has unveiled commercial-scale 60 Ah cells aimed at electric
  vehicles, defense platforms and stationary energy storage. Coreshell is a materials and
  cell manufacturer, not a software vendor: its public web presence is a Webflow marketing
  site with no developer portal, API reference, machine-readable specification, SDK, or
  public code repository.'
